name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  busted:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua and busted
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 liblua5.3-dev luarocks
          sudo luarocks install busted

      - name: Run busted tests (capture output)
        run: busted --verbose > busted-output.txt 2>&1 || true
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: busted-output
          path: busted-output.txt
      - name: Run busted tests
        run: busted --verbose

  legacy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Run legacy unit tests
        run: lua5.3 tests/test_addon.lua

  luacheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Luacheck
        uses: nebularg/actions-luacheck@v1
        with:
          files: "CraftOrderList.lua"
          annotate: warning
