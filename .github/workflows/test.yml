name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  busted:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua and busted
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 liblua5.3-dev luarocks
          sudo luarocks install busted

      - name: Run busted tests
        run: |
          busted --verbose 2>&1 | tee /tmp/busted.txt; exit_code=${PIPESTATUS[0]}
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/busted.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $exit_code

  legacy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Run legacy unit tests
        run: lua5.3 tests/test_addon.lua

  luacheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Luacheck
        uses: nebularg/actions-luacheck@v1
        with:
          files: "CraftOrderList.lua"
          annotate: warning
